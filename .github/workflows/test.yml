name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go build ./...
      - name: Generated commands are current
        run: go generate ./... && git status --porcelain && test -z "$(git status --porcelain)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Release dry run
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: 'v2.20.0'
          args: release --snapshot --clean --skip=sign
      - run: bash scripts/test-install.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-dist
          path: |
            dist/cloudafrica-cli_*_windows_*.zip
            dist/cloudafrica-cli_*_SHA256SUMS
          retention-days: 1

  install-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: ca update on Windows
        run: go test -count=1 ./internal/update/...
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-dist
          path: dist
      - name: install.ps1 on PowerShell 7
        run: pwsh -NoProfile -File scripts/test-install.ps1
      - name: install.ps1 on Windows PowerShell 5.1
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-install.ps1
