      - {header: EXPIRES, path: expiresAt, format: time}
  PublicObjectUploadUrlDto:
    id: url
    columns:
      - {header: URL, path: url}
      - {header: EXPIRES, path: expiresAt, format: time}
  PublicBucketProtectionDto:
    id: defaultEncryption
