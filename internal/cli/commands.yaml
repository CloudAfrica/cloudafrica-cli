# The overlay on the SDK's openapi.json that `go generate ./...` (internal/gen)
# turns into commands_gen.go. An operation not hand-written, excluded or pending
# here is generated, and generation fails if it cannot be (no column set, say).

nouns:
  network-interfaces: nics
  ip-addresses: ips
  kubernetes: k8s

groups:
  vms: Manage virtual machines
  vms backups: Manage a VM's backups
  vms backup-policy: Manage a VM's backup policy
  vms disks: Manage a VM's disks
  vms firewall-rules: Manage a VM's firewall rules
  vms nics: Manage a VM's network interfaces
  vms private-ips: Manage a VM's private IP addresses
  vms public-ips: Manage a VM's public IP addresses
  vms ssh-keys: Manage the SSH keys on a VM
  vms vips: Manage a VM's virtual IP membership
  ssh-keys: Manage SSH keys
  vpcs: Manage VPCs
  vpcs firewall-rules: List a VPC's firewall rules
  vpcs reserved-ips: Manage a VPC's reserved public IP addresses
  vips: Manage virtual IPs
  vips firewall-rules: Manage a virtual IP's firewall rules
  vips public-ip: Attach and detach a virtual IP's public address
  ips: List IP addresses
  buckets: Manage object storage buckets
  buckets versioning: Read and change a bucket's versioning
  buckets objects: List a bucket's objects and get short-lived upload and download URLs
  buckets lifecycle: Read and replace a bucket's lifecycle rules
  buckets cors: Read and replace a bucket's CORS rules
  bucket-keys: Manage object storage access keys
  datacenters: List datacenters and check placement feasibility
  os-images: List OS images
  operations: Inspect and cancel asynchronous operations
  placement-groups: Manage placement groups
  placement-groups members: Manage a placement group's members
  account: Show the account and its limits
  activity: List account activity
  backup-policies: List the backup policy of every VM
  backup-windows: List the backup windows
  billing: Read the balance and accrual, and manage the billing details
  billing details: Read and change the billing details
  members: Manage the account's members
  members role: Change a member's role
  projects: Manage projects
  projects resources: Manage the resources in a project
  support: Raise and follow support tickets
  support tickets: Manage support tickets
  transactions: List invoices and credit notes

# The `ca --help` heading of each top-level group (cmdspec.Sections); hand-written ones set theirs in Go.
sections:
  vms: compute
  os-images: compute
  placement-groups: compute
  datacenters: compute
  ssh-keys: compute
  backup-policies: compute
  backup-windows: compute
  vpcs: networking
  vips: networking
  ips: networking
  buckets: storage
  bucket-keys: storage
  account: account
  members: account
  projects: account
  billing: account
  transactions: account
  activity: account
  support: support
  operations: cli

# A group answers to its singular too, so a v0.9.0 name still runs; these replace that default
# where the singular was never a command name.
aliases:
  billing details: []
  buckets cors: []
  vips firewall-rules: []
  ips: [ip-address]

resources:
  vm: {noun: VM, list: /v1/vms, match: name, idPattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'}
  vpc: {noun: VPC, list: /v1/vpcs, match: name}
  vip: {noun: VIP, list: /v1/vips, match: name}
  ssh-key: {noun: SSH key, list: /v1/ssh-keys, match: name}
  placement-group: {noun: placement group, list: /v1/placement-groups, match: name}
  bucket: {noun: bucket, list: /v1/buckets, match: name}
  bucket-key: {noun: bucket key, list: /v1/bucket-keys, match: name}
  project: {noun: project, list: /v1/projects, match: name}
  member: {noun: member, list: /v1/members, match: email, id: userId}
  support-ticket: {noun: support ticket, list: /v1/support/tickets, match: reference}

params:
  /v1/vms/{id}: {resource: vm}
  /v1/vms/{id}/ssh-keys/{keyId}: {resource: ssh-key}
  /v1/vms/{id}/vips/{vipId}: {resource: vip}
  /v1/vms/{id}/backups/{startedAt}: {convert: epoch, help: "the backup's start time: RFC 3339 or epoch seconds"}
  /v1/ssh-keys/{id}: {resource: ssh-key}
  /v1/vpcs/{id}: {resource: vpc}
  /v1/vpcs/{id}/vips/{vipId}: {resource: vip, within: vpcId}
  /v1/placement-groups/{id}: {resource: placement-group}
  /v1/buckets/{id}: {resource: bucket, help: "the bucket name or id"}
  /v1/bucket-keys/{keyId}: {resource: bucket-key, help: "the key name or id"}
  /v1/bucket-keys/{keyId}/buckets/{bucketId}: {resource: bucket, help: "the bucket name or id"}
  /v1/placement-groups/{id}/members/{vmId}: {resource: vm}
  /v1/projects/{id}: {resource: project}
  /v1/projects/{id}/resources/{resourceId}: {help: "the resource's id (ca projects resources list shows it)"}
  /v1/members/{userId}: {resource: member, help: "the member's email or user id"}
  /v1/support/tickets/{id}: {resource: support-ticket, help: "the ticket's reference number or id"}

handwritten:
  createVm: vms create
  listKubernetesClusters: k8s list
  getKubernetesCluster: k8s get
  upgradeKubernetesClusterWorkers: k8s upgrade-workers
  createKubernetesClusterToken: k8s token
  getKubernetesClusterKubeconfig: k8s kubeconfig

exclude:
  - {prefix: /v1/kubernetes, reason: k8s lifecycle and node metrics are deferred}
  - {prefix: /v1/ai, reason: AI sandboxes are their own product}
  - {prefix: /v1/cards, reason: payment cards are managed in the portal; checkout is a browser flow}
  - {operation: createElevationRequest, reason: ca auth elevate}
  - {operation: getMe, reason: ca auth status}
  - {operation: getSupportTicketAttachment, reason: the public API lists no attachment ids}
  - {operation: deleteVmFirewallRules, reason: firewall-rule delete covers one rule}
  - {operation: deleteVpcVipFirewallRules, reason: firewall-rule delete covers one rule}


operations:
  listVms:
    flags:
      slug: {help: only the VM with this slug}
    example: |
      ca vms list
      ca vms list -o json
  getVm:
    example: ca vms get web-01
  startVm:
    example: ca vms start web-01
  shutdownVm:
    flags:
      timeout: {name: guest-timeout}
  applyVmPendingRestart:
    flags:
      timeout: {name: guest-timeout}
  resizeVm:
    flags:
      cpus: {name: vcpu, help: the new vCPU count}
      ramMib: {name: ram-gib, scale: 1024, help: the new RAM in GiB}
      empty: {hide: true}
    atLeastOne: [vcpu, ram-gib]
    example: ca vms resize web-01 --vcpu 4 --ram-gib 8
  renameVm:
    example: ca vms rename web-01 --name db-01
  backupVm:
    path: vms backups create
  attachVmNetworkInterface:
    path: vms nics attach
  detachVmNetworkInterface:
    path: vms nics detach
  attachVmPublicIp:
    path: vms public-ips attach
  detachVmPublicIp:
    path: vms public-ips detach
  attachVmSshKey:
    path: vms ssh-keys attach
  detachVmSshKey:
    path: vms ssh-keys detach
  addVmToVip:
    path: vms vips add
  removeVmFromVip:
    path: vms vips remove
  addPlacementGroupMember:
    path: placement-groups members add
  removePlacementGroupMember:
    path: placement-groups members remove
  updateVmBackupProtection:
    path: vms backups set-protection
  previewVmBackupPolicyRotation:
    path: vms backup-policy preview-rotation
  cancelOperation:
    path: operations cancel
    wait: self
  createVpcVip:
    path: vips create
  deleteVpcVip:
    path: vips delete
  listVpcVipFirewallRules:
    path: vips firewall-rules list
  createVpcVipFirewallRule:
    path: vips firewall-rules create
  deleteVpcVipFirewallRule:
    path: vips firewall-rules delete
  setVpcVipFirewallRuleDescription:
    path: vips firewall-rules update
  attachVpcVipPublicIp:
    path: vips public-ip attach
  detachVpcVipPublicIp:
    path: vips public-ip detach
  addVmDisk:
    path: vms disks create
  createVpc:
    example: ca vpcs create --name web
  listIpAddresses:
    example: |
      ca ips list
      ca ips list -o json
  listPlacementGroupDatacenters:
    path: datacenters list
  createBucket:
    example: |
      ca buckets create --display-name backups
      ca buckets create --display-name audit --object-lock --versioning enabled
  deleteBucket:
    flags:
      confirmBucketName: {help: "the bucket's name, spelled exactly as ca buckets list shows it"}
    example: ca buckets delete logs-7f3a --confirm-bucket-name logs-7f3a
  getBucketUsage:
    path: buckets usage
    positional: id
    example: ca buckets usage logs-7f3a --hours 168
  getBucketVersioning:
    path: buckets versioning get
    positional: id
  updateBucketVersioning:
    path: buckets versioning set
    positional: id
    example: ca buckets versioning set logs-7f3a --mode enabled
  getBucketProtection:
    path: buckets protection
    positional: id
    example: ca buckets protection logs-7f3a
  listBucketObjects:
    path: buckets objects list
    positional: id
    example: |
      ca buckets objects list logs-7f3a
      ca buckets objects list logs-7f3a --prefix reports/2026/ --limit 50
  listBucketDeletedObjects:
    path: buckets objects list-deleted
    positional: id
    example: ca buckets objects list-deleted logs-7f3a --prefix reports/
  listBucketObjectVersions:
    path: buckets objects versions
    positional: id
    example: ca buckets objects versions logs-7f3a --key reports/q3.pdf
  getBucketObjectMetadata:
    path: buckets objects get
    positional: id
    example: ca buckets objects get logs-7f3a --key reports/q3.pdf
  createObjectDownloadUrl:
    path: buckets objects download-url
    positional: id
    flags:
      versionId: {help: "an earlier version to download (ca buckets objects versions lists them); omit for the current one"}
    example: |
      ca buckets objects download-url logs-7f3a --key reports/q3.pdf
      # -q prints the URL, which expires in about a minute
      URL=$(ca buckets objects download-url logs-7f3a --key reports/q3.pdf --yes -q) && curl -fsS -o q3.pdf "$URL"
  createObjectUploadUrl:
    path: buckets objects upload-url
    positional: id
    flags:
      key: {help: "the new object's key, such as reports/q3.pdf; a key that already exists is refused"}
      contentType: {help: "the Content-Type the upload will send"}
      contentLength: {help: "the exact size of the upload in bytes, at most 25 MiB"}
    example: |
      ca buckets objects upload-url logs-7f3a --key reports/q3.pdf --content-type application/pdf \
        --content-length 2048 -o json
  getBucketLifecycle:
    path: buckets lifecycle get
    positional: id
    example: ca buckets lifecycle get logs-7f3a
  replaceBucketLifecycle:
    path: buckets lifecycle set
    positional: id
    example: |
      # Expire current versions after 30 days; basedOn is the rules as you read them
      ca buckets lifecycle get logs-7f3a -o json \
        | jq '{rules: (.rules | map(.expirationDays = 30)), basedOn: .rules}' \
        | ca buckets lifecycle set logs-7f3a -d @- --yes
  getBucketCors:
    path: buckets cors get
    positional: id
    example: ca buckets cors get logs-7f3a
  replaceBucketCors:
    path: buckets cors set
    positional: id
    example: |
      # Remove every rule; basedOn is the rules as you read them
      ca buckets cors get logs-7f3a -o json \
        | jq '{rules: [], basedOn: .rules}' \
        | ca buckets cors set logs-7f3a -d @- --yes
  createBucketKey:
    flags:
      bucketResourceId: {help: "the id of the bucket to attach the key to (ca buckets get NAME -q prints it), not its name; omit for an account-level key"}
    example: |
      ca bucket-keys create --name ci --access-type read --bucket-resource-id "$(ca buckets get logs-7f3a -q)"
      # -q prints the secret key, not the id
      SECRET=$(ca bucket-keys create --name ci2 --access-type full --yes -q)
  revealBucketKeySecret:
    example: |
      ca bucket-keys reveal-secret ci
      # -q prints the secret key, not the id
      SECRET=$(ca bucket-keys reveal-secret ci --yes -q)
  grantBucketKeyBucketAccess:
    path: bucket-keys grant
    positional: keyId
    example: ca bucket-keys grant ci --bucket logs-7f3a
  revokeBucketKeyBucketAccess:
    path: bucket-keys revoke
    positional: keyId
    example: ca bucket-keys revoke ci --bucket logs-7f3a

  getAccount:
    example: ca account get
  getAccountLimits:
    path: account limits
    example: ca account limits
  getAccountDeletedVmBackupRetention:
    path: account backup-retention
  listActivity:
    exclusive: [[types], [subject-type, subject-id]]
    example: |
      ca activity list --limit 20
      ca activity list --types vm,vpc
      ca activity list --subject-type vm --subject-id "$(ca vms get web-01 -q)"
  listBackupPolicies:
    path: backup-policies list
  listBackupWindows:
    path: backup-windows list
  getBillingBalance:
    path: billing balance
    example: ca billing balance
  getBillingAccrual:
    path: billing accrual
    example: ca billing accrual
  getBillingDetails:
    path: billing details get
  updateBillingDetails:
    path: billing details set
    atLeastOne: [billing-email, vat-number, company-number, postal-address1, postal-address2, postal-address3, postal-address4, postal-address5, country-code]
    example: ca billing details set --billing-email accounts@example.com
  listTransactions:
    example: ca transactions list
  createMember:
    example: ca members create --email jo@example.com --role operator
  deleteMember:
    example: ca members delete jo@example.com
  cancelMemberInvitation:
    example: ca members cancel-invitation jo@example.com
  resendMemberInvitation:
    example: ca members resend-invitation jo@example.com
  updateMemberRole:
    path: members role set
    positional: userId
    example: ca members role set jo@example.com --role admin
  getPlacementFeasibility:
    path: datacenters feasibility
    flags:
      datacenterSlug: {name: datacenter}
      ramMib: {name: ram-gib, scale: 1024, help: the VM's RAM in GiB}
    example: ca datacenters feasibility --datacenter jnb --vcpu 4 --ram-gib 8 --boot-disk-gib 40
  createProject:
    example: ca projects create --name Production --slug PRD
  updateProject:
    example: ca projects update prod --name Production
  moveProjectResource:
    path: projects resources move
    positional: resourceId
    example: ca projects resources move "$(ca vms get web-01 -q)" --project prod
  listSupportTickets:
    flags:
      q: {name: search}
    example: |
      ca support tickets list
      ca support tickets list --status open,waiting-on-you
  getSupportTicket:
    example: ca support tickets get 1234
  createSupportTicket:
    example: ca support tickets create --subject "Backup failed" --description "The nightly backup of web-01 failed"
  createSupportTicketReply:
    path: support tickets reply
    positional: id
    example: ca support tickets reply 1234 --body "That fixed it"
  resolveSupportTicket:
    example: ca support tickets resolve 1234

columns:
  PublicVmDto:
    columns:
      - {header: ID, path: id}
      - {header: NAME, path: name}
      - {header: STATUS, path: status}
      - {header: VCPU, path: cpu.cores}
      - {header: RAM MIB, path: memory.totalMb}
      - {header: DATACENTER, path: datacenter}
      - {header: PRIVATE IP, path: privateIp}
      - {header: PUBLIC IP, path: publicIp}
  PublicOperationDto:
    columns:
      - {header: ID, path: id}
      - {header: KIND, path: kind}
      - {header: STATE, path: state}
      - {header: PROGRESS, path: progressPct}
      - {header: TARGET, path: target.id}
      - {header: SUBMITTED, path: submittedAt, format: time}
      - {header: MESSAGE, path: progressMessage}
      - {header: ERROR, path: error.message}
  PublicVmDiskDto:
    columns:
      - {header: ID, path: id}
      - {header: POSITION, path: position}
      - {header: SIZE GIB, path: sizeGib}
      - {header: INTERFACE, path: interfaceType}
      - {header: BOOT, path: boot, format: bool}
  PublicVmNicDto:
    columns:
      - {header: ID, path: id}
      - {header: POSITION, path: position}
      - {header: MODEL, path: model}
      - {header: PRIMARY, path: primary, format: bool}
      - {header: IP, path: ipAddress}
      - {header: MAC, path: macAddress}
      - {header: VLAN, path: vlanTag}
  PublicVmPublicIpDto:
    columns:
      - {header: ID, path: id}
      - {header: ADDRESS, path: address}
      - {header: PRIMARY, path: primary, format: bool}
      - {header: CREATED, path: createdAt, format: time}
  PublicVmPrivateIpDto:
    columns:
      - {header: ID, path: id}
      - {header: ADDRESS, path: address}
      - {header: NIC, path: nicId}
  PublicSshKeyDto:
    columns:
      - {header: ID, path: id}
      - {header: NAME, path: name}
      - {header: FINGERPRINT, path: fingerprint}
  PublicFirewallRuleDto:
    columns:
      - {header: ID, path: id}
      - {header: DIRECTION, path: direction, format: upper}
      - {header: ACTION, path: action, format: upper}
      - {header: PROTOCOL, path: protocol, format: upper}
      - {header: SOURCE, path: source}
      - {header: FROM PORT, path: fromPort}
      - {header: TO PORT, path: toPort}
      - {header: STATUS, path: status}
      - {header: DESCRIPTION, path: description}
  PublicBackupDto:
    id: startedAt
    columns:
      - {header: STARTED, path: startedAt, format: time}
      - {header: SIZE, path: sizeBytes, format: bytes}
      - {header: DURATION S, path: durationSeconds}
      - {header: PROTECTED, path: protected, format: bool}
      - {header: ORIGIN, path: origin}
      - {header: DESCRIPTION, path: description}
  PublicBackupPolicyDto:
    id: planId
    columns:
      - {header: PLAN, path: planDisplayName}
      - {header: CADENCE, path: cadenceKind}
      - {header: DAY, path: cadenceDay}
      - {header: WINDOW, path: windowPreference}
      - {header: PAUSED, path: paused, format: bool}
      - {header: LAST RUN, path: lastFiredSlot, format: time}
  PublicPlacementFeasibilityDto:
    id: datacenterSlug
    columns:
      - {header: DATACENTER, path: datacenterSlug}
      - {header: AVAILABLE, path: available, format: bool}
      - {header: FITS, path: fits}
      - {header: REASONS, path: reasons, format: list}
  PublicPlacementGroupDto:
    columns:
      - {header: ID, path: id}
      - {header: NAME, path: name}
      - {header: STRATEGY, path: strategy}
      - {header: DATACENTER, path: datacenterId}
      - {header: HEALTH, path: health}
      - {header: MEMBERS, path: members, format: count}
      - {header: MAX, path: maxMembers}
  PublicPlacementDatacenterDto:
    id: slug
    columns:
      - {header: SLUG, path: slug}
      - {header: NAME, path: label}
  PublicOsImageDto:
    columns:
      - {header: ID, path: id}
      - {header: NAME, path: name}
      - {header: OS, path: os}
      - {header: VERSION, path: version}
      - {header: SSH KEY, path: requiresSshKey, format: bool}
  PublicVpcDto:
    columns:
      - {header: ID, path: id}
      - {header: NAME, path: name}
      - {header: STATUS, path: status}
      - {header: DESCRIPTION, path: description}
      - {header: CREATED, path: createdAt, format: time}
  PublicVipDto:
    columns:
      - {header: ID, path: id}
      - {header: NAME, path: name}
      - {header: VPC, path: vpcName}
      - {header: PUBLIC IP, path: publicAddress}
      - {header: PRIVATE IP, path: privateAddress}
      - {header: SERVED BY, path: servedBy, format: count}
  PublicReservedIpDto:
    columns:
      - {header: ID, path: id}
      - {header: ADDRESS, path: address}
      - {header: VM, path: vmId}
  PublicIpAddressDto:
    id: address
    columns:
      - {header: ADDRESS, path: address}
      - {header: KIND, path: kind}
      - {header: OWNER, path: ownerName}
      - {header: OWNER KIND, path: ownerKind}
      - {header: VPC, path: vpcName}
      - {header: PRIMARY, path: primary, format: bool}
  PublicVipFirewallRulesDto:
    rows: rules
    columns:
      - {header: ID, path: id}
      - {header: DIRECTION, path: direction, format: upper}
      - {header: ACTION, path: action, format: upper}
      - {header: PROTOCOL, path: protocol, format: upper}
      - {header: SOURCE, path: source}
      - {header: FROM PORT, path: fromPort}
      - {header: TO PORT, path: toPort}
      - {header: STATUS, path: status}
      - {header: DESCRIPTION, path: description}
  PublicBucketDto:
    columns:
      - {header: ID, path: id}
      - {header: NAME, path: name}
      - {header: DISPLAY NAME, path: displayName}
      - {header: STATUS, path: status}
      - {header: BILLED, path: quotaBytes, format: bytes}
      - {header: ON DISK, path: sizeActualBytes, format: bytes}
      - {header: OBJECTS, path: objectCount}
      - {header: CREATED, path: createdAt, format: time}
  PublicBucketObjectDto:
    id: key
    columns:
      - {header: KEY, path: key}
      - {header: SIZE, path: sizeBytes, format: bytes}
      - {header: TYPE, path: contentType}
      - {header: MODIFIED, path: lastModified, format: time}
  PublicBucketObjectVersionDto:
    id: versionId
    columns:
      - {header: KEY, path: key}
      - {header: VERSION, path: versionId}
      - {header: LATEST, path: latest, format: bool}
      - {header: DELETE MARKER, path: deleteMarker, format: bool}
      - {header: SIZE, path: sizeBytes, format: bytes}
      - {header: MODIFIED, path: lastModified, format: time}
  PublicBucketObjectMetadataDto:
    id: key
    columns:
      - {header: KEY, path: key}
      - {header: VERSION, path: versionId}
      - {header: SIZE, path: sizeBytes, format: bytes}
      - {header: TYPE, path: contentType}
      - {header: ETAG, path: etag}
      - {header: MODIFIED, path: lastModified, format: time}
      - {header: RETENTION, path: retentionMode}
      - {header: RETAIN UNTIL, path: retainUntil, format: time}
      - {header: LEGAL HOLD, path: legalHold, format: bool}
  PublicObjectDownloadUrlDto:
    id: url
    columns:
      - {header: URL, path: url}
      - {header: EXPIRES, path: expiresAt, format: time}
  PublicObjectUploadUrlDto:
    id: url
    columns:
      - {header: URL, path: url}
      - {header: EXPIRES, path: expiresAt, format: time}
  PublicBucketProtectionDto:
    id: defaultEncryption
    columns:
      - {header: OBJECT LOCK, path: objectLock, format: bool}
      - {header: DEFAULT ENCRYPTION, path: defaultEncryption}
  PublicBucketLifecycleDto:
    rows: rules
    columns:
      - {header: PREFIX, path: prefix}
      - {header: ENABLED, path: enabled, format: bool}
      - {header: EXPIRE DAYS, path: expirationDays}
      - {header: NONCURRENT DAYS, path: noncurrentExpirationDays}
      - {header: ABORT UPLOAD DAYS, path: abortIncompleteUploadDays}
      - {header: DELETE MARKERS, path: expireDeleteMarker, format: bool}
  PublicBucketCorsDto:
    rows: rules
    columns:
      - {header: ORIGINS, path: allowedOrigins, format: list}
      - {header: METHODS, path: allowedMethods, format: list}
      - {header: HEADERS, path: allowedHeaders, format: list}
      - {header: EXPOSE, path: exposeHeaders, format: list}
      - {header: MAX AGE, path: maxAgeSeconds}
  PublicBucketKeyDto:
    columns:
      - {header: ID, path: id}
      - {header: NAME, path: name}
      - {header: ACCESS KEY, path: accessKey}
      - {header: ACCESS, path: accessType}
      - {header: MASTER, path: master, format: bool}
      - {header: BUCKET, path: bucketName}
  PublicBucketKeyCreatedDto:
    id: secretKey
    columns:
      - {header: ID, path: key.id}
      - {header: NAME, path: key.name}
      - {header: ACCESS KEY, path: key.accessKey}
      - {header: ACCESS, path: key.accessType}
      - {header: BUCKET, path: key.bucketName}
      - {header: SECRET KEY, path: secretKey}
  PublicRevealedKeySecretDto:
    id: secretKey
